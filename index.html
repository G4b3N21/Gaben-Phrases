<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="apple-touch-icon" href="ikon.jpg">
    <link rel="icon" type="image/jpeg" href="ikon.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Gaben QuickChat">
    <title>Gaben QuickChat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e1b4b, #09090b 60%, #0f172a);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 16px 90px 16px;
        }
        .app-wrapper { width: 100%; max-width: 460px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
        h1 { font-size: 1.4rem; font-weight: 800; background: linear-gradient(to right, #a855f7, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-actions { display: flex; gap: 8px; }
        .icon-btn { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12); color: #e2e8f0; padding: 7px 11px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .icon-btn.active { background: rgba(168, 85, 247, 0.25); border-color: #a855f7; color: #fff; box-shadow: 0 0 12px rgba(168, 85, 247, 0.3); }
        .combine-bar { display: none; background: rgba(168, 85, 247, 0.15); border: 1px solid rgba(168, 85, 247, 0.4); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; flex-direction: column; gap: 10px; }
        .combine-bar.visible { display: flex; }
        .combine-preview { font-size: 0.95rem; color: #fff; white-space: pre-wrap; word-break: break-word; line-height: 1.45; min-height: 44px; background: rgba(0, 0, 0, 0.28); padding: 10px 12px; border-radius: 10px; }
        .combine-clear { align-self: flex-end; background: rgba(255, 255, 255, 0.12); border: none; color: #fca5a5; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .search-wrap { position: relative; margin-bottom: 14px; }
        .search-box { width: 100%; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 14px; padding: 11px 36px 11px 14px; color: #fff; font-size: 0.95rem; outline: none; backdrop-filter: blur(12px); }
        .search-box:focus { border-color: #38bdf8; }
        .search-box::placeholder { color: #64748b; }
        .search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.12); border: none; color: #cbd5e1; width: 22px; height: 22px; border-radius: 50%; font-size: 0.75rem; cursor: pointer; display: none; align-items: center; justify-content: center; }
        .search-clear.visible { display: flex; }
        .tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: rgba(255, 255, 255, 0.04); padding: 5px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); margin-bottom: 16px; }
        .tab-btn { background: transparent; border: none; color: #94a3b8; padding: 9px 4px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: linear-gradient(135deg, rgba(147, 51, 234, 0.4), rgba(37, 99, 235, 0.4)); color: #fff; border: 1px solid rgba(168, 85, 247, 0.4); }
        .items-list { display: flex; flex-direction: column; gap: 10px; }
        .items-list.grid-view { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
        .card:active { transform: scale(0.98); background: rgba(168, 85, 247, 0.18); }
        .card.pinned { border-color: rgba(250, 204, 21, 0.35); background: rgba(250, 204, 21, 0.04); }
        .card-content { flex: 1; min-width: 0; }
        .card-main { font-size: 0.98rem; font-weight: 500; color: #f8fafc; word-wrap: break-word; line-height: 1.4; }
        .grid-view .card { flex-direction: column; padding: 12px 8px; text-align: center; }
        .grid-view .card-main { font-size: 1.05rem; font-weight: 600; text-align: center; }
        .card-note { font-size: 0.8rem; color: #94a3b8; margin-top: 4px; line-height: 1.3; }
        .card-controls { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
        .ctrl-btn { background: rgba(255, 255, 255, 0.06); border: none; color: #94a3b8; width: 28px; height: 28px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .ctrl-btn.starred { color: #facc15; background: rgba(250, 204, 21, 0.15); }
        .fab-add { position: fixed; bottom: 22px; right: 22px; background: linear-gradient(135deg, #9333ea, #2563eb); color: white; border: none; border-radius: 20px; padding: 14px 20px; font-size: 0.95rem; font-weight: 700; box-shadow: 0 10px 25px rgba(147, 51, 234, 0.5); cursor: pointer; z-index: 50; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 100; }
        .modal-overlay.open { display: flex; }
        .modal-box { width: 100%; max-width: 400px; background: #131524; border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 22px; padding: 22px; }
        .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; color: #fff; }
        .modal-input, .modal-select { width: 100%; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 12px; padding: 12px; color: #fff; font-size: 0.95rem; margin-bottom: 12px; outline: none; }
        .modal-btns { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 8px; }
        .btn-cancel { background: rgba(255, 255, 255, 0.08); border: none; color: #cbd5e1; padding: 10px 14px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .btn-save { background: linear-gradient(135deg, #9333ea, #2563eb); border: none; color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(16, 185, 129, 0.95); color: white; padding: 10px 18px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s; z-index: 200; white-space: nowrap; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <div class="header">
            <h1>⚔️ Gaben</h1>
            <div class="header-actions">
                <button id="combineToggle" class="icon-btn" onclick="toggleCombine()">➕ Combine</button>
                <button class="icon-btn" onclick="openBackupModal()">💾 Data</button>
            </div>
        </div>

                <div id="combineBar" class="combine-bar">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span id="heroCounter" style="font-size:0.78rem; font-weight:700; color:#38bdf8;"></span>
                <div style="display:flex; gap:8px;">
                    <button class="combine-clear" style="color:#cbd5e1;" onclick="undoCombined()">↩️ Undo</button>
                    <button class="combine-clear" onclick="clearCombined()">Clear</button>
                </div>
            </div>
            <div id="combinePreview" class="combine-preview">Tap items or heroes to combine...</div>
        </div>

        <div class="search-wrap">
            <input type="text" id="searchInput" class="search-box" oninput="onSearchInput()" placeholder="🔍 Find phrase, hero, emoji, slang...">
            <button id="searchClear" class="search-clear" onclick="clearSearch()">✕</button>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('phrases', this)">💬 Phrases</button>
            <button class="tab-btn" onclick="switchTab('heroes', this)">🦸 Heroes</button>
            <button class="tab-btn" onclick="switchTab('emojis', this)">💥 Emojis</button>
            <button class="tab-btn" onclick="switchTab('slang', this)">📖 Slang</button>
        </div>

        <div id="itemsList" class="items-list"></div>
    </div>

    <button class="fab-add" onclick="openAddModal()">+ Add New</button>

    <div id="itemModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalTitle" class="modal-title">Add New Item</div>
            <select id="itemCategory" class="modal-select">
                <option value="phrases">💬 Phrase</option>
                <option value="heroes">🦸 Hero</option>
                <option value="emojis">💥 Emoji / Combo</option>
                <option value="slang">📖 Slang / Abbreviation</option>
            </select>
            <input type="text" id="itemText" class="modal-input" placeholder="Text, Hero name, Emoji, or Slang">
            <input type="text" id="itemNote" class="modal-input" placeholder="Short note / role / meaning (optional)">
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('itemModal')">Cancel</button>
                <button class="btn-save" onclick="saveItem()">Save</button>
            </div>
        </div>
    </div>

    <div id="backupModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-title">💾 Export & Import Data</div>
            <p style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px;">Export saves a .json file to your iPhone Files. Import loads it back.</p>
            <div class="modal-btns" style="justify-content: stretch; margin-bottom: 14px;">
                <button class="btn-save" style="flex:1;" onclick="exportFile()">📤 Export File</button>
                <button class="btn-cancel" style="flex:1; color:#38bdf8;" onclick="document.getElementById('importFileInput').click()">📥 Import File</button>
                <input type="file" id="importFileInput" accept=".json" style="display:none;" onchange="importFile(event)">
            </div>
            <p style="font-size: 0.75rem; color: #64748b; margin-bottom: 6px;">Or copy/paste raw backup text:</p>
            <textarea id="backupData" class="modal-input" style="height: 80px; font-size: 0.7rem;"></textarea>
            <div class="modal-btns">
                <button class="btn-cancel" onclick="closeModal('backupModal')">Close</button>
                <button class="btn-cancel" onclick="copyBackup()">Copy</button>
                <button class="btn-save" onclick="restoreBackup()">Load Text</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Copied!</div>
       <script>
        const DEFAULT_DATA = [
            { id: 1, category: 'phrases', text: 'Local Bridge down!', note: '', pinned: true },
            { id: 2, category: 'phrases', text: 'Global Bridge down!', note: '', pinned: true },
            { id: 3, category: 'phrases', text: 'Hi all! Chill day today.', note: '', pinned: false },
            { id: 4, category: 'phrases', text: 'Can someone drop a training team:', note: 'Use with Combine + Heroes', pinned: false },
            { id: 5, category: 'phrases', text: 'Attack [TARGET] on the Bridge!', note: 'Smart placeholder example', pinned: false },
            { id: 6, category: 'heroes', text: 'Kayla', note: '', pinned: true },
            { id: 7, category: 'heroes', text: 'Aidan', note: '', pinned: true },
            { id: 8, category: 'heroes', text: 'Guus', note: '', pinned: true },
            { id: 9, category: 'heroes', text: 'Julius', note: '', pinned: false },
            { id: 10, category: 'heroes', text: 'Oya', note: '', pinned: false },
            { id: 11, category: 'emojis', text: 'BOOM! 💥', note: '', pinned: true },
            { id: 12, category: 'emojis', text: '👊', note: '', pinned: true },
            { id: 13, category: 'emojis', text: 'GG! 🔥', note: '', pinned: false },
            { id: 14, category: 'emojis', text: 'WP! 👏', note: '', pinned: false },
            { id: 15, category: 'slang', text: 'IDK', note: 'I don\'t know (Nem tudom)', pinned: false },
            { id: 16, category: 'slang', text: 'OFC', note: 'Of course (Természetesen)', pinned: false },
            { id: 17, category: 'slang', text: 'GG / WP', note: 'Good Game / Well Played (Jó játék / Szép volt)', pinned: false },
            { id: 18, category: 'slang', text: 'RNG', note: 'Random Number Generator (Szerencsefaktor / kritikus)', pinned: false }
        ];

        let items = JSON.parse(localStorage.getItem('guildQuickChatData')) || DEFAULT_DATA;
        let currentTab = 'phrases';
        let editingId = null;
        let combineMode = false;
        let combinedBuffer = [];

        function saveToStorage() { localStorage.setItem('guildQuickChatData', JSON.stringify(items)); }

        function switchTab(tab, btn) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderItems();
        }

        function onSearchInput() {
            const val = document.getElementById('searchInput').value;
            document.getElementById('searchClear').classList.toggle('visible', val.length > 0);
            renderItems();
        }

        function clearSearch() {
            const inp = document.getElementById('searchInput');
            inp.value = '';
            document.getElementById('searchClear').classList.remove('visible');
            renderItems();
        }

        function toggleCombine() {
            combineMode = !combineMode;
            document.getElementById('combineToggle').classList.toggle('active', combineMode);
            document.getElementById('combineBar').classList.toggle('visible', combineMode);
            if (!combineMode) { combinedBuffer = []; updateCombinePreview(); }
        }

        function undoCombined() {
            if (combinedBuffer.length > 0) {
                combinedBuffer.pop();
                updateCombinePreview();
                const fullText = combinedBuffer.map(x => x.text).join(' ');
                if (fullText) copyTextToClipboard(fullText, 'Undone & Copied!');
                else showToast('Removed last item');
            }
        }

        function clearCombined() { combinedBuffer = []; updateCombinePreview(); }

        function updateCombinePreview() {
            const previewEl = document.getElementById('combinePreview');
            const counterEl = document.getElementById('heroCounter');
            previewEl.innerText = combinedBuffer.length ? combinedBuffer.map(x => x.text).join(' ') : 'Tap items or heroes to combine...';
            
            const heroCount = combinedBuffer.filter(x => x.category === 'heroes').length;
            if (heroCount > 0) {
                counterEl.innerText = `🦸 Team: ${heroCount}/5` + (heroCount === 5 ? ' ✅' : heroCount > 5 ? ' ⚠️' : '');
                counterEl.style.color = heroCount === 5 ? '#4ade80' : heroCount > 5 ? '#f87171' : '#38bdf8';
            } else {
                counterEl.innerText = '';
            }
        }

        function resolvePlaceholders(text) {
            const matches = text.match(/\[(.*?)\]/g);
            if (!matches) return text;
            let result = text;
            for (const m of matches) {
                const label = m.replace(/[\[\]]/g, '');
                const val = prompt('Enter ' + label + ':');
                if (val === null) return null;
                result = result.replace(m, val.trim());
            }
            return result;
        }

        function handleCardClick(item) {
            const finalText = resolvePlaceholders(item.text);
            if (finalText === null) return;

            if (combineMode) {
                if (item.category === 'heroes' && combinedBuffer.some(x => x.category === 'heroes' && x.text === finalText)) {
                    showToast(finalText + ' is already in the team!');
                    return;
                }
                combinedBuffer.push({ text: finalText, category: item.category });
                updateCombinePreview();
                copyTextToClipboard(combinedBuffer.map(x => x.text).join(' '), 'Combined & Copied!');
            } else {
                copyTextToClipboard(finalText, 'Copied: ' + finalText);
            }
        }


        function handleCardClick(item) {
            const finalText = resolvePlaceholders(item.text);
            if (finalText === null) return;

            if (combineMode) {
                combinedBuffer.push(finalText);
                updateCombinePreview();
                copyTextToClipboard(combinedBuffer.join(' '), 'Combined & Copied!');
            } else {
                copyTextToClipboard(finalText, 'Copied: ' + finalText);
            }
        }

        function copyTextToClipboard(text, toastMsg) {
            navigator.clipboard.writeText(text).then(() => showToast(toastMsg)).catch(() => {
                const temp = document.createElement('textarea');
                temp.value = text;
                document.body.appendChild(temp);
                temp.select();
                document.execCommand('copy');
                document.body.removeChild(temp);
                showToast(toastMsg);
            });
        }
         function renderItems() {
            const list = document.getElementById('itemsList');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const isGrid = (currentTab === 'emojis' || currentTab === 'heroes') && !query;
            list.className = isGrid ? 'items-list grid-view' : 'items-list';
            list.innerHTML = '';

            let filtered = items.filter(item => {
                const matchesTab = query ? true : item.category === currentTab;
                const matchesQuery = !query || item.text.toLowerCase().includes(query) || (item.note && item.note.toLowerCase().includes(query));
                return matchesTab && matchesQuery;
            });

            filtered.sort((a, b) => (b.pinned === true) - (a.pinned === true));

            if (filtered.length === 0) {
                list.innerHTML = '<div style="text-align:center; color:#64748b; padding:30px; grid-column:1/-1;">No items found. Tap "+ Add New" to create one!</div>';
                return;
            }

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card' + (item.pinned ? ' pinned' : '');
                card.onclick = () => handleCardClick(item);

                const content = document.createElement('div');
                content.className = 'card-content';
                const main = document.createElement('div');
                main.className = 'card-main';
                main.innerText = item.text;
                content.appendChild(main);

                if (item.note) {
                    const note = document.createElement('div');
                    note.className = 'card-note';
                    note.innerText = item.note;
                    content.appendChild(note);
                }

                const controls = document.createElement('div');
                controls.className = 'card-controls';
                controls.onclick = (e) => e.stopPropagation();

                const starBtn = document.createElement('button');
                starBtn.className = 'ctrl-btn' + (item.pinned ? ' starred' : '');
                starBtn.innerText = '⭐';
                starBtn.onclick = () => togglePin(item.id);

                const editBtn = document.createElement('button');
                editBtn.className = 'ctrl-btn';
                editBtn.innerText = '✏️';
                editBtn.onclick = () => openEditModal(item);

                const delBtn = document.createElement('button');
                delBtn.className = 'ctrl-btn';
                delBtn.innerText = '🗑️';
                delBtn.onclick = () => deleteItem(item.id);

                controls.appendChild(starBtn);
                controls.appendChild(editBtn);
                controls.appendChild(delBtn);
                card.appendChild(content);
                card.appendChild(controls);
                list.appendChild(card);
            });
        }

        function togglePin(id) {
            const idx = items.findIndex(i => i.id === id);
            if (idx > -1) { items[idx].pinned = !items[idx].pinned; saveToStorage(); renderItems(); }
        }

        function deleteItem(id) {
            if (confirm('Delete this item?')) { items = items.filter(i => i.id !== id); saveToStorage(); renderItems(); }
        }

        function openAddModal() {
            editingId = null;
            document.getElementById('modalTitle').innerText = 'Add New Item';
            document.getElementById('itemCategory').value = currentTab;
            document.getElementById('itemText').value = '';
            document.getElementById('itemNote').value = '';
            document.getElementById('itemModal').classList.add('open');
            document.getElementById('itemText').focus();
        }

        function openEditModal(item) {
            editingId = item.id;
            document.getElementById('modalTitle').innerText = 'Edit Item';
            document.getElementById('itemCategory').value = item.category;
            document.getElementById('itemText').value = item.text;
            document.getElementById('itemNote').value = item.note || '';
            document.getElementById('itemModal').classList.add('open');
        }

        function closeModal(modalId) { document.getElementById(modalId).classList.remove('open'); }

        function saveItem() {
            const category = document.getElementById('itemCategory').value;
            const text = document.getElementById('itemText').value.trim();
            const note = document.getElementById('itemNote').value.trim();
            if (!text) { showToast('Please enter text!'); return; }

            if (editingId) {
                const idx = items.findIndex(i => i.id === editingId);
                if (idx > -1) { items[idx].category = category; items[idx].text = text; items[idx].note = note; }
            } else {
                items.unshift({ id: Date.now(), category, text, note, pinned: false });
            }
            saveToStorage();
            closeModal('itemModal');
            renderItems();
            showToast('Saved!');
        }

        function openBackupModal() {
            document.getElementById('backupData').value = JSON.stringify(items);
            document.getElementById('backupModal').classList.add('open');
        }

        function exportFile() {
            const dataStr = JSON.stringify(items, null, 2);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const date = new Date().toISOString().slice(0, 10);
            a.href = url;
            a.download = `gaben-quickchat-${date}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast('File exported!');
        }

        function importFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        items = parsed;
                        saveToStorage();
                        renderItems();
                        closeModal('backupModal');
                        showToast('File imported!');
                    } else { alert('Invalid JSON file!'); }
                } catch (err) { alert('Error reading file!'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function copyBackup() { copyTextToClipboard(document.getElementById('backupData').value, 'Backup copied!'); }

        function restoreBackup() {
            try {
                const parsed = JSON.parse(document.getElementById('backupData').value);
                if (Array.isArray(parsed)) { items = parsed; saveToStorage(); renderItems(); closeModal('backupModal'); showToast('Database restored!'); }
                else { alert('Invalid backup code!'); }
            } catch (e) { alert('Invalid backup code!'); }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        renderItems();
    </script>
</body>
</html>
